yaml
name: Build SaturnRecomp Launcher
on: [workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-size: 'x64'
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r launcher/requirements.txt pyinstaller

      - name: Run Build Script
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_launcher.ps1

      - name: Upload Compiled Executable
        uses: actions/upload-artifact@v4
        with:
          name: SaturnRecomp-Windows
          path: dist/SaturnRecomp/
